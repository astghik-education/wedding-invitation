<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Նորայր & Զեմֆիրա | Հարսանիք | 25.10.2026</title>
  <meta name="description" content="Հարսանյաց հրավիրատոմս՝  Նորայր & Զեմֆիրա | 25.10.2026" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Noto+Sans+Armenian:wght@400;600;700&family=Noto+Serif+Armenian:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f7f5f2;
      --bg-2: #fbfaf8;
      --ink: #26221e;
      --muted: #8b8680;
      --accent: #7c2b3a;
      --accent-soft: rgba(124, 43, 58, 0.08);
      --line: rgba(38, 34, 30, 0.14);
      --card: #ffffff;
      --shadow: 0 18px 45px rgba(38, 34, 30, 0.1);
      --radius: 22px;
      --font-body: "Noto Sans Armenian", "Cormorant Garamond", serif;
      --font-title: "Great Vibes", "Noto Serif Armenian", cursive;
      --font-serif: "Cormorant Garamond", "Noto Serif Armenian", serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    body.locked { overflow: hidden; height: 100vh; }
    [hidden] { display: none !important; }
    img, video { max-width: 100%; display: block; }

    .container { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .section { padding: 88px 0; position: relative; }

    .section-title {
      margin: 0 0 22px;
      text-align: center;
      font-family: var(--font-title);
      font-size: clamp(2.4rem, 6vw, 4rem);
      color: var(--ink);
      font-weight: 500;
    }

    .section-subtitle {
      text-align: center;
      color: var(--muted);
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.8;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 26px;
      border: 1px solid rgba(124, 43, 58, 0.4);
      background: transparent;
      color: var(--accent);
      text-decoration: none;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0.06em;
      transition: 0.25s ease;
    }

    .btn:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }
    .btn.small { min-height: 42px; padding: 10px 16px; font-size: 0.95rem; }

    /* Language switcher */
    .lang-switcher {
      position: fixed;
      top: 16px; right: 16px; z-index: 1300;
      display: flex; gap: 4px; padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .lang-btn {
      border: 0; background: transparent; color: var(--muted);
      font: inherit; font-size: 0.9rem; padding: 8px 12px;
      border-radius: 999px; cursor: pointer; transition: 0.2s;
    }

    .lang-btn.active { background: var(--accent); color: #fff; font-weight: 700; }

    /* Overlay */
    .invite-overlay {
      position: fixed; inset: 0; z-index: 1200;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: linear-gradient(160deg, rgba(250, 249, 247, 0.97), rgba(240, 237, 232, 0.97));
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .invite-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .overlay-card {
      width: min(720px, 100%);
      padding: clamp(30px, 6vw, 64px);
      text-align: center;
      border-radius: 30px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow);
      animation: floatIn 1.1s ease both;
    }

    .overlay-card .pretitle {
      margin: 0 0 14px; text-transform: uppercase;
      letter-spacing: 0.32em; color: var(--muted); font-size: 0.85rem;
    }

    .overlay-card .names {
      margin: 14px 0 10px;
      font-family: var(--font-title);
      font-size: clamp(2.8rem, 9vw, 5.4rem);
      line-height: 1.1; color: var(--ink); font-weight: 500;
    }

    .overlay-card .date {
      margin: 0 0 26px; color: var(--accent);
      letter-spacing: 0.24em; text-transform: uppercase; font-size: 0.95rem;
    }

    .overlay-line {
      width: 84px; height: 1px; margin: 0 auto 22px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Hero */
    .hero {
      min-height: 100vh; position: relative;
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden; padding: 90px 0 70px;
      background: linear-gradient(180deg, #4c4c4c, #8f8f8f 40%, #b9b9b9);
    }

    .hero-media { position: absolute; inset: 0; z-index: 0; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.85); }

    .hero-overlay {
      position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(25, 23, 21, 0.55), rgba(25, 23, 21, 0.1) 32%, rgba(25, 23, 21, 0.12) 62%, rgba(25, 23, 21, 0.5));
    }

    .hero-content { position: relative; z-index: 2; color: #fff; }

    .hero-content h1 {
      margin: 0 0 18px;
      font-family: var(--font-title);
      font-weight: 500;
      font-size: clamp(3rem, 11vw, 6.4rem);
      line-height: 1.08;
      text-shadow: 0 6px 26px rgba(0, 0, 0, 0.35);
    }

    .heart-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin: 0 auto 34px; max-width: 320px;
    }

    .heart-divider::before,
    .heart-divider::after { content: ""; height: 1px; flex: 1; background: rgba(255, 255, 255, 0.75); }
    .heart-divider svg { width: 26px; height: 24px; fill: #b9b3ae; }

    .save-the-date {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      margin: 0 0 26px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    }

    .date-block { display: flex; align-items: center; justify-content: center; gap: 22px; color: #fff; }

    .date-block .db-side {
      font-family: var(--font-serif);
      font-size: clamp(1.1rem, 4vw, 1.7rem);
      letter-spacing: 0.22em;
      padding: 12px 26px;
      border-top: 1px solid rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
    }

    .date-block .db-day {
      font-family: var(--font-serif);
      font-size: clamp(3.4rem, 12vw, 5.6rem);
      font-weight: 700; line-height: 1;
    }

    /* Welcome */
    .welcome-text {
      max-width: 780px; margin: 0 auto; text-align: center;
      white-space: pre-line; line-height: 2.05;
      font-size: clamp(1rem, 2.5vw, 1.15rem); color: #6f6a64;
    }

    .card {
      padding: clamp(24px, 5vw, 44px);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    /* Countdown */
    .cd-digits {
      display: flex; justify-content: center; align-items: baseline;
      gap: 6px; margin: 10px 0 6px;
      font-family: var(--font-serif);
      color: var(--accent);
      font-weight: 700;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      letter-spacing: 0.04em;
    }

    .cd-digits .sep { opacity: 0.85; }

    .cd-labels {
      display: flex; justify-content: center; gap: clamp(14px, 6vw, 54px);
      color: var(--muted); font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.14em;
    }

    /* Calendar */
    .cal-wrap { max-width: 620px; margin: 0 auto; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: center; }

    .cal-dow {
      color: var(--muted); letter-spacing: 0.12em; font-size: 0.88rem;
      text-transform: uppercase; text-align: center; padding: 10px 0;
    }

    .cal-day {
      position: relative; height: 54px;
      display: flex; align-items: center; justify-content: center;
      color: #6f6a64; font-size: 1.05rem;
    }

    .cal-day.heart-day svg { position: absolute; width: 46px; height: 42px; fill: #e6e1db; }
    .cal-day.heart-day span { position: relative; color: var(--accent); font-weight: 700; }

    .cal-caption {
      margin-top: 20px; text-align: center; color: var(--accent);
      font-family: var(--font-title); font-size: 1.6rem;
    }

    /* Gallery */
    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 30px; }

    @media (min-width: 760px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }

    .gallery-item {
      aspect-ratio: 3 / 4;
      border-radius: 999px 999px 20px 20px;
      overflow: hidden; cursor: pointer;
      background: #eceae6;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease;
    }

    .gallery-item:hover { transform: scale(1.02); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    .gallery-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: #b6b0aa; font-size: 2rem;
      background: linear-gradient(160deg, #f0eeea, #e2dfda);
    }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(20, 18, 16, 0.92);
      display: none; align-items: center; justify-content: center; padding: 34px;
    }

    .lightbox.active { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 14px; }

    .lightbox-close {
      position: absolute; top: 18px; right: 18px;
      width: 48px; height: 48px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.12); color: #fff;
      font-size: 1.5rem; cursor: pointer;
    }

    /* Timeline */
    .timeline { position: relative; max-width: 820px; margin: 0 auto; padding-left: 28px; }

    .timeline::before {
      content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 1px;
      background: linear-gradient(180deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .timeline-item {
      position: relative; margin: 26px 0; padding: 22px;
      border-radius: 20px; border: 1px solid var(--line);
      background: var(--card); box-shadow: var(--shadow);
    }

    .timeline-item::before {
      content: ""; position: absolute; left: -26px; top: 30px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft);
    }

    .timeline-img {
      height: 250px;
      max-width: 360px;
      margin: 4px auto 18px;
      border-radius: 999px 999px 18px 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #eceae6;
      box-shadow: var(--shadow);
    }

    .timeline-img img { width: 100%; height: 100%; object-fit: cover; }

    .timeline-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
    .timeline-time { color: var(--accent); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.08em; }
    .timeline-icon { font-size: 1.4rem; }
    .timeline-title { margin: 0 0 6px; font-size: 1.3rem; color: var(--ink); font-family: var(--font-serif); font-weight: 700; }
    .timeline-venue, .timeline-address { margin: 4px 0; color: var(--muted); line-height: 1.7; }
    .map-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

    /* Dress code */
    .palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 34px; }

    .swatch {
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--swatch);
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 26px rgba(38, 34, 30, 0.18);
      position: relative; cursor: default;
    }

    .swatch::after {
      content: attr(data-name);
      position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%);
      white-space: nowrap; font-size: 0.85rem; color: var(--muted);
      opacity: 0; transition: 0.25s ease; pointer-events: none;
    }

    .swatch:hover::after { opacity: 1; }

    /* RSVP */
    .rsvp-form { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
    .form-label { font-weight: 600; margin-bottom: 8px; display: block; }

    .input {
      width: 100%; min-height: 54px; padding: 14px 16px;
      border-radius: 14px; border: 1px solid var(--line);
      background: var(--bg-2); color: var(--ink);
      font: inherit; outline: none; transition: 0.2s ease;
    }

    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .input::placeholder { color: #b3ada6; }

    .radio-group { display: grid; gap: 12px; }

    .choice {
      display: flex; align-items: center; gap: 12px;
      padding: 15px 16px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--bg-2);
      cursor: pointer; transition: 0.2s ease;
    }

    .choice:hover { border-color: rgba(124, 43, 58, 0.45); background: var(--accent-soft); }
    .choice input { accent-color: var(--accent); width: 18px; height: 18px; }

    .form-message { min-height: 24px; margin: 0; text-align: center; color: var(--accent); line-height: 1.7; }

    /* Music control */
    .music-control {
      position: fixed; right: 16px; bottom: 16px; z-index: 1100;
      display: flex; align-items: center; gap: 10px;
    }

    .music-song {
      max-width: 62vw;
      padding: 10px 16px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      color: var(--ink); font-size: 0.88rem;
      box-shadow: var(--shadow);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .music-btn {
      width: 58px; height: 58px; border-radius: 50%;
      border: 4px solid #fff; background: #3a3a3a; color: #fff;
      font-size: 1.1rem; cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s ease;
    }

    .music-btn:hover { transform: scale(1.06); }

    /* Hidden YouTube player */
    .yt-hidden {
      position: fixed; bottom: 0; left: 0;
      width: 2px; height: 2px;
      opacity: 0; pointer-events: none; overflow: hidden;
    }

    /* Falling light hearts */
    #flowers { position: fixed; inset: 0; pointer-events: none; z-index: 950; overflow: hidden; }

    .flower {
      position: fixed; top: -8vh;
      color: #f4c6ce; /* light pink heart */
      text-shadow: 0 1px 3px rgba(124, 43, 58, 0.18);
      animation: fall linear forwards;
      opacity: 0.9;
      will-change: transform;
    }

    .flower i { display: inline-block; font-style: normal; animation: sway 2.8s ease-in-out infinite alternate; }

    @keyframes fall { to { transform: translateY(118vh) rotate(var(--rot)); } }

    @keyframes sway {
      from { transform: translateX(calc(var(--sway) * -1)) rotate(-16deg); }
      to { transform: translateX(var(--sway)) rotate(16deg); }
    }

    footer { padding: 40px 0 120px; text-align: center; color: var(--muted); }

    .reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 700px) {
      .section { padding: 64px 0; }
      .timeline { padding-left: 22px; }
      .timeline-item::before { left: -20px; }
      .lang-switcher { top: 12px; right: 12px; }
      .date-block { gap: 12px; }
      .date-block .db-side { padding: 10px 14px; }
      .timeline-img { height: 210px; }
    }
  </style>
</head>

<body class="locked">

  <!-- Language switcher -->
  <div class="lang-switcher" aria-label="Language switcher">
    <button class="lang-btn active" type="button" data-lang="hy">ՀԱՅ</button>
    <button class="lang-btn" type="button" data-lang="ru">РУС</button>
    <button class="lang-btn" type="button" data-lang="en">ENG</button>
  </div>

  <!-- Opening invitation overlay -->
  <div class="invite-overlay" id="inviteOverlay" role="dialog" aria-modal="true">
    <div class="overlay-card">
      <p class="pretitle" data-i18n="weddingInvitation">Հարսանյաց հրավիրատոմս</p>
      <div class="overlay-line"></div>
      <h2 class="names" data-i18n="coupleNames"> Նորայր & Զեմֆիրա </h2>
      <p class="date" data-wedding-date>25.10.2026</p>
      <button class="btn" id="openInviteBtn" type="button" data-i18n="openInvitation">Բացել հրավիրատոմսը</button>
    </div>
  </div>

  <!-- Falling light hearts -->
  <div id="flowers" aria-hidden="true"></div>

  <main>
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-media" aria-hidden="true">
        <img id="heroImg" alt="" />
      </div>
      <div class="hero-overlay"></div>

      <div class="hero-content container">
        <h1 data-i18n="coupleNames"> Նորայր & Զեմֆիրա </h1>

        <div class="heart-divider" aria-hidden="true">
          <svg viewBox="0 0 32 29"><path d="M23.6 0c-3.2 0-6 1.7-7.6 4.2C14.4 1.7 11.6 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 16 20.2 16 20.2s16-10.8 16-20.2C32 3.8 28.2 0 23.6 0z"/></svg>
        </div>

        <p class="save-the-date">Save the date</p>

        <div class="date-block">
          <span class="db-side" id="dbMonth">OCT</span>
          <span class="db-day" id="dbDay">25</span>
          <span class="db-side" id="dbYear">2026</span>
        </div>
      </div>
    </section>

    <!-- Welcome -->
    <section class="section reveal" id="welcome">
      <div class="container">
        <h2 class="section-title" data-i18n="welcomeTitle">Ողջույնի խոսք</h2>
        <p class="welcome-text" data-i18n="welcomeText"></p>
      </div>
    </section>

    <!-- Countdown -->
    <section class="section reveal" id="countdown">
      <div class="container">
        <h2 class="section-title" data-i18n="countdownTitle">Միջոցառմանը մնաց</h2>
        <div class="cd-digits" aria-live="polite">
          <span id="cdDays">00</span><span class="sep">:</span>
          <span id="cdHours">00</span><span class="sep">:</span>
          <span id="cdMinutes">00</span><span class="sep">:</span>
          <span id="cdSeconds">00</span>
        </div>
        <div class="cd-labels">
          <span id="lblDays">Օր</span>
          <span id="lblHours">Ժամ</span>
          <span id="lblMinutes">Րոպե</span>
          <span id="lblSeconds">Վայրկյան</span>
        </div>
      </div>
    </section>

    <!-- Calendar -->
    <section class="section reveal" id="calendar">
      <div class="container">
        <h2 class="section-title" id="calMonthTitle">Հոկտեմբեր</h2>
        <div class="cal-wrap">
          <div class="cal-grid" id="calGrid"></div>
          <p class="cal-caption" data-i18n="calendarCaption">Մեր հարսանիքի օրը</p>
        </div>
      </div>
    </section>

    <!-- Gallery -->
    <section class="section reveal" id="gallery">
      <div class="container">
        <h2 class="section-title" data-i18n="galleryTitle">Մեր պահերը</h2>
        <p class="section-subtitle" data-i18n="gallerySubtitle"></p>
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </section>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
      <img id="lightboxImg" alt="" />
    </div>

    <!-- Timeline -->
    <section class="section reveal" id="schedule">
      <div class="container">
        <h2 class="section-title" data-i18n="scheduleTitle">Օրվա ժամանակացույց</h2>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- Dress code -->
    <section class="section reveal" id="dresscode">
      <div class="container">
        <h2 class="section-title" data-i18n="dressCodeTitle">Dress Code</h2>
        <p class="section-subtitle" data-i18n="dressCodeText"></p>
        <div class="palette">
          <span class="swatch" style="--swatch:#F7F1E6" data-i18n-title="colorIvory" data-name="Ivory"></span>
          <span class="swatch" style="--swatch:#E8D3B0" data-i18n-title="colorChampagne" data-name="Champagne"></span>
          <span class="swatch" style="--swatch:#C9A36B" data-i18n-title="colorGold" data-name="Gold"></span>
          <span class="swatch" style="--swatch:#8E9E8A" data-i18n-title="colorSage" data-name="Sage"></span>
          <span class="swatch" style="--swatch:#5C6B7A" data-i18n-title="colorDustyBlue" data-name="Dusty Blue"></span>
        </div>
      </div>
    </section>

    <!-- RSVP -->

    function pad(n) { return String(n).padStart(2, "0"); }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function locale() { return { hy: "hy-AM", ru: "ru-RU", en: "en-GB" }[currentLang] || "en-GB"; }

    function formatDateLong() {
      try {
        return new Intl.DateTimeFormat(locale(), { day: "numeric", month: "long", year: "numeric" }).format(weddingDate);
      } catch (e) { return "25.10.2026"; }
    }

    function updateCountdown() {
      let diff = weddingDate - new Date();
      if (diff < 0) diff = 0;
      document.getElementById("cdDays").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("cdHours").textContent = pad(Math.floor(diff / 3600000) % 24);
      document.getElementById("cdMinutes").textContent = pad(Math.floor(diff / 60000) % 60);
      document.getElementById("cdSeconds").textContent = pad(Math.floor(diff / 1000) % 60);

      document.getElementById("lblDays").textContent = t("days");
      document.getElementById("lblHours").textContent = t("hours");
      document.getElementById("lblMinutes").textContent = t("minutes");
      document.getElementById("lblSeconds").textContent = t("seconds");
    }

    function renderDateBlock() {
      let m = "OCT";
      try { m = new Intl.DateTimeFormat(locale(), { month: "short" }).format(weddingDate); } catch (e) {}
      document.getElementById("dbMonth").textContent = m.toUpperCase();
      document.getElementById("dbDay").textContent = weddingDate.getDate();
      document.getElementById("dbYear").textContent = weddingDate.getFullYear();
    }

    function renderCalendar() {
      const y = weddingDate.getFullYear(), m = weddingDate.getMonth(), day = weddingDate.getDate();

      let monthName = "Հոկտեմբեր";
      try { monthName = cap(new Intl.DateTimeFormat(locale(), { month: "long" }).format(weddingDate)); } catch (e) {}
      document.getElementById("calMonthTitle").textContent = monthName + " " + y;

      const heartSVG = '<svg viewBox="0 0 32 29" aria-hidden="true"><path d="M23.6 0c-3.2 0-6 1.7-7.6 4.2C14.4 1.7 11.6 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 16 20.2 16 20.2s16-10.8 16-20.2C32 3.8 28.2 0 23.6 0z"/></svg>';

      let html = WEEKDAYS[currentLang].map(d => `<div class="cal-dow">${d}</div>`).join("");

      const start = (new Date(y, m, 1).getDay() + 6) % 7;
      for (let i = 0; i < start; i++) html += `<div class="cal-day"></div>`;

      const daysInMonth = new Date(y, m + 1, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        html += (d === day)
          ? `<div class="cal-day heart-day">${heartSVG}<span>${d}</span></div>`
          : `<div class="cal-day">${d}</div>`;
      }

      document.getElementById("calGrid").innerHTML = html;
    }

    function renderGallery() {
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = PHOTOS.gallery.map(src => `
        <div class="gallery-item" data-img="${src}">
          <img src="${src}" alt="" loading="lazy"
               onerror="this.outerHTML='<div class=\\'gallery-placeholder\\'>♥</div>';" />
        </div>
      `).join("");

      grid.querySelectorAll(".gallery-item").forEach(item => {
        item.addEventListener("click", () => {
          document.getElementById("lightboxImg").src = item.getAttribute("data-img");
          document.getElementById("lightbox").classList.add("active");
        });
      });
    }

    function closeLightbox() { document.getElementById("lightbox").classList.remove("active"); }
    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    document.getElementById("lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLightbox(); });

    /* Timeline with pictures */

      document.getElementById("timeline").innerHTML = EVENTS.map(ev => `

            <span class="timeline-time">${ev.time}</span>
            <span class="timeline-icon">${ev.icon}</span>
          </div>
          <h3 class="timeline-title">${t(ev.titleKey)}</h3>
          <p class="timeline-venue">${t(ev.venueKey)}</p>
          <p class="timeline-address">${t(ev.addressKey)}</p>
          <div class="map-actions">
            <a class="btn small" href="${WEDDING.maps[ev.mapKey]}" target="_blank" rel="noopener noreferrer">📍 ${t("openMap")}</a>
          </div>
        </article>
      `).join("");
      observeReveals();
    }

    /* Falling light hearts ♥ */
    function spawnFlower(withDelay) {
      if (flowersBox.childElementCount > 60) return;
      const f = document.createElement("span");

      f.style.fontSize = (12 + Math.random() * 16) + "px";
      f.style.animationDuration = dur + "s";
      f.style.setProperty("--sway", (10 + Math.random() * 28) + "px");
      f.style.setProperty("--rot", Math.floor(Math.random() * 360) + "deg");
      if (withDelay) f.style.animationDelay = (-Math.random() * dur) + "s";
      f.innerHTML = "<i>♥</i>";
      f.addEventListener("animationend", () => f.remove());
      flowersBox.appendChild(f);
    }

    function startFlowers() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      for (let i = 0; i < 14; i++) spawnFlower(true);
      setInterval(() => spawnFlower(false), 550);
    }

    /* MUSIC — YouTube */
    let ytPlayer = null;
    let ytReady = false;
    let wantPlay = false;

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("ytPlayer", {
        width: "2",
        height: "2",
        videoId: YOUTUBE_ID,
        playerVars: { autoplay: 0, controls: 0, rel: 0, playsinline: 1 },
        events: {
          onReady: () => {
            ytReady = true;
            if (wantPlay) ytPlayer.playVideo();
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) { e.target.seekTo(0); e.target.playVideo(); }
            if (e.data === YT.PlayerState.PLAYING) playPauseBtn.textContent = "❚❚";
            if (e.data === YT.PlayerState.PAUSED) playPauseBtn.textContent = "▶";
          },
          onError: () => { musicSongLabel.textContent = t("musicError"); }
        }
      });
    };

    function playMusic() {
      wantPlay = true;
      if (ytReady && ytPlayer) {
        ytPlayer.playVideo();
      } else {
        setTimeout(() => { if (wantPlay && !ytReady) musicSongLabel.textContent = t("musicError"); }, 4000);
      }
    }

    function pauseMusic() {
      wantPlay = false;
      if (ytReady && ytPlayer) ytPlayer.pauseVideo();
    }

    playPauseBtn.addEventListener("click", () => {
      if (!ytReady) { musicSongLabel.textContent = t("musicError"); return; }
      const state = ytPlayer.getPlayerState();
      (state === YT.PlayerState.PLAYING) ? pauseMusic() : playMusic();
    });

    /* Translations */
    function applyTranslations() {
      document.documentElement.lang = currentLang;
      document.title = t("pageTitle");

      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.getAttribute("data-i18n")));
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder = t(el.getAttribute("data-i18n-placeholder")));
      document.querySelectorAll("[data-i18n-title]").forEach(el => {
        const v = t(el.getAttribute("data-i18n-title"));
        el.title = v; el.setAttribute("aria-label", v);
        if (el.classList.contains("swatch")) el.dataset.name = v;
      });
      document.querySelectorAll("[data-wedding-date]").forEach(el => el.textContent = formatDateLong());
      document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === currentLang));

      musicSongLabel.textContent = t("musicSong");

      renderDateBlock();
      renderCalendar();
      renderTimeline();
      updateCountdown();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("weddingLang", lang);
      applyTranslations();
    }

    document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const revealObserver = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
    }, { threshold: 0.12 });

    function observeReveals() {
      document.querySelectorAll(".reveal:not(.visible)").forEach(el => revealObserver.observe(el));
    }

    openInviteBtn.addEventListener("click", () => {
      inviteOverlay.classList.add("hidden");
      document.body.classList.remove("locked");
      musicControl.hidden = false;
      startFlowers();  /* 💗 light hearts fall */
      playMusic();
      setTimeout(() => { inviteOverlay.style.display = "none"; }, 900);
    });

    /* RSVP */
    const rsvpForm = document.getElementById("rsvpForm");
    const formMessage = document.getElementById("formMessage");

    rsvpForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = document.getElementById("guestName").value.trim();
      const attendance = rsvpForm.querySelector('input[name="attendance"]:checked');
      const submitBtn = rsvpForm.querySelector('button[type="submit"]');

      formMessage.textContent = "";
      if (!name) { formMessage.textContent = t("rsvpErrorName"); return; }
      if (!attendance) { formMessage.textContent = t("rsvpErrorAttendance"); return; }

      const payload = { name, attendance: attendance.value, weddingDate: WEDDING.dateISO, language: currentLang, submittedAt: new Date().toISOString() };
      submitBtn.disabled = true;

      try {
        if (RSVP_ENDPOINT) {
          const res = await fetch(RSVP_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error("fail");
        }
        localStorage.setItem("rsvp_" + name.toLowerCase().replace(/\s+/g, "_"), JSON.stringify(payload));
        formMessage.textContent = attendance.value === "yes" ? t("rsvpSuccessYes") : t("rsvpSuccessNo");
        rsvpForm.reset();
      } catch (e) {
        formMessage.textContent = t("rsvpErrorSubmit");
      } finally {
        submitBtn.disabled = false;
      }
    });

    /* Init */
    const heroImg = document.getElementById("heroImg");
    heroImg.src = PHOTOS.hero;
    heroImg.onerror = () => { heroImg.style.display = "none"; };

    applyTranslations();
    renderGallery();
    observeReveals();
  </script>
</body>
</html>
